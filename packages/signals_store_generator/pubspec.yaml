name: signals_store_generator
description: >-
  Code generator for signals_store. Turns an abstract class annotated with a
  single @Store annotation into a concrete subclass with Signal-backed reactive
  fields and Computed-backed derived getters.
version: 0.5.0
repository: https://github.com/bysensa/signals-store
issue_tracker: https://github.com/bysensa/signals-store/issues
topics:
  - signals
  - state-management
  - codegen
  - build-runner

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # Workspace auto-resolves this to the local package during development;
  # when published, it points to the hosted version on pub.dev.
  signals_store_annotation: ^0.2.0
  # analyzer 12.1.0 is the highest version compatible with Flutter's pinned
  # meta 1.18.0 (analyzer >=13.1.0 requires meta ^1.18.3, which no stable
  # Flutter SDK provides yet) AND with the test stack in this workspace
  # (test >=1.31.2 requires analyzer >=13, but flutter_test pins test_api
  # 0.7.11, forbidding test >=1.31.2). 12.1.0 satisfies both. Higher analyzer
  # becomes available once Flutter's bundled meta and the test stack allow it.
  analyzer: ^12.1.0
  build: ^4.0.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: ^2.4.0
  build_test: ^3.0.0
  lints: ^5.0.0
  package_config: ^2.1.0
  path: ^1.9.0
  signals: ^7.0.0
  test: ^1.25.0
